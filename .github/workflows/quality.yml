name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate freeze inputs without requiring readiness
        run: python tools/check_freeze.py --report-only
      - name: Audit course evidence readiness
        run: python tools/audit_submission.py
